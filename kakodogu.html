<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>過去ログ</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="sen.css" />
</head>
<body>
  <div class="top-nav"><a href="index.html">←トップ</a></div>

  <header>
    <h1>過去ログ</h1>
  </header>

  <div class="log-layout">
    <div class="log-list">
      <div class="log-month" onclick="toggleMonth('g202609')">2026年9月</div>
      <div class="log-days" id="g202609">
        <span class="log-day" onclick="showEntry('2026-09-11')">11日</span>
      </div>
    </div>
    <div class="log-view">
    <div class="entry" id="entry-2026-09-11">
      <div class="date">2026-09-11 16:44<span class="article-title">ご</span></div>
      <p>け</p>
    </div>
    </div>
  </div>

  <script>
    function showEntry(date) {
      var entries = document.querySelectorAll('.log-view .entry');
      for (var i = 0; i < entries.length; i++) {
        entries[i].hidden = (entries[i].id !== 'entry-' + date);
      }
    }
    function toggleMonth(id) {
      var box = document.getElementById(id);
      box.hidden = !box.hidden;
    }
    if (location.hash) {
      showEntry(location.hash.replace('#entry-', ''));
    }
  </script>
</body>
</html>
