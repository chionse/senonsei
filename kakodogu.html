<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>過去ログ</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="sen.css" />
</head>
<body>
  <div class="top-nav"><a href="index.html">←トップ</a></div>

  <header>
    <h1>過去ログ</h1>
  </header>

  <div class="log-layout">
    <div class="log-list">
      <div class="log-row"><span class="log-ym">2026年</span><span class="log-ym">9月</span><span class="log-days"><span class="log-day" onclick="showEntry('2026-09-11')">11日</span></span></div>
    </div>
    <div class="log-view">
    <div class="entry" id="entry-2026-09-11">
      <div class="entry-title">ご</div>
      <div class="date">2026-09-11 16:44</div>
      <p>け</p>
    </div>
    </div>
  </div>

  <script>
    function showEntry(date) {
      var entries = document.querySelectorAll('.log-view .entry');
      for (var i = 0; i < entries.length; i++) {
        entries[i].hidden = (entries[i].id !== 'entry-' + date);
      }
      var days = document.querySelectorAll('.log-day');
      for (var j = 0; j < days.length; j++) {
        days[j].classList.remove('here');
      }
    }
    if (location.hash) {
      showEntry(location.hash.replace('#entry-', ''));
    }
  </script>
</body>
</html>
