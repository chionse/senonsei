<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>千遠生へのメッセージ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="sen.css" />
</head>
<body>
  <header>
    <h1>メニュー</h1>
  </header>

  <p class="keyword-count">ブログが始まって 0 日目 / 解禁済み 1 / 全 5 通</p>
  <p>時間が経つごとに、少しずつメッセージが読めるようになります。</p>

  <div class="message-entry">
    <div class="message-day">0日目に解禁</div>
    <div class="message-text">(ここに0日目=ブログを始めた日に見せたいメッセージを書いてください)</div>
  </div>
  <div class="message-entry locked">
    <div class="message-day">7日目に解禁</div>
    <div class="message-text">???</div>
  </div>
  <div class="message-entry locked">
    <div class="message-day">14日目に解禁</div>
    <div class="message-text">???</div>
  </div>
  <div class="message-entry locked">
    <div class="message-day">30日目に解禁</div>
    <div class="message-text">???</div>
  </div>
  <div class="message-entry locked">
    <div class="message-day">60日目に解禁</div>
    <div class="message-text">???</div>
  </div>

  <nav>
    <a href="index.html">トップページへ戻る</a>
    <a href="keyword.html">キーワードメモへ</a>
  </nav>

</html>
