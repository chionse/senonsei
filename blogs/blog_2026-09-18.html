<!DOCTYPE html>
<html lang="ja">
<head>

<body>
<div class="top-nav"><a href="../index.html">←トップ</a></div>
<header>
  <h1>千遠生のブログ</h1>
</header>
<article>
  <div class="date">2026-09-18 14:19<span class="article-title">ゆ</span><div class="iine"><button type="button" data-day="2026-09-18" aria-label="いいね" title="いいね">♡</button><span class="kazu">0</span></div></div>
  <p>がお</p>
</article>
  <script id="iine-script">
    (function () {
      var where = "https://senonsei-comments.chitomatsu.workers.dev/like";
      var kept = function (key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      };
      var keep = function (key) {
        try { localStorage.setItem(key, "1"); } catch (e) {}
      };
      document.querySelectorAll(".iine button").forEach(function (button) {
        var day = button.getAttribute("data-day");
        var kazu = button.parentElement.querySelector(".kazu");
        if (kept("iine-" + day)) {
          button.disabled = true;
          button.textContent = "♥";
          return;
        }
        button.addEventListener("click", function () {
          button.disabled = true;
          button.textContent = "♥";
          keep("iine-" + day);
          kazu.textContent = (parseInt(kazu.textContent, 10) || 0) + 1;
          fetch(where, {
            method: "POST",
            body: new URLSearchParams({ day: day })
          }).catch(function () {});
        });
      });
    })();
  </script>
</body>
</html>
