name: Chain probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: How far may Senonsei walk a one-way path
        run: |
          python - <<'PY'
          import collections, random
          import senonsei_ai as s

          PLACES = [
            "https://www.aozora.gr.jp/cards/000148/files/789_14547.html",
            "https://www.aozora.gr.jp/cards/000879/files/127_15260.html",
            "https://anond.hatelabo.jp/",
            "https://www3.nhk.or.jp/news/",
            "https://kakuyomu.jp/",
          ]
          texts = []
          for url in PLACES:
              try:
                  title, text, links, pictures = s.open_page(url)
                  texts.append(text)
              except Exception as e:
                  print(f"  x {url[:50]}: {str(e)[:40]}")
          whole = "\n".join(texts)
          seen = collections.Counter()
          for t in texts:
              seen.update(s.WORD_CANDIDATE.findall(t))
          ranked = [w for w, _ in seen.most_common()]
          print(f"読んだ: {len(texts)}箇所 / 異なる言葉 {len(ranked)}\n")

          KANA = list("あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん")

          def speak(state, how_long, one_way_allowed):
              """一本道を続けて何語まで歩いてよいかを変えて試す"""
              chain = state.get("what_follows") or {}
              starts = [w for w, f in chain.items() if len(f) >= 2]
              if not starts:
                  return None
              said = [random.choice(starts)]
              one_way = 0
              while len("".join(said)) < how_long:
                  follows = chain.get(said[-1])
                  if not follows:
                      break
                  if len(follows) < 2:
                      one_way += 1
                      if one_way > one_way_allowed:
                          break
                  else:
                      one_way = 0
                  words = list(follows)
                  said.append(random.choices(words, weights=[follows[w] for w in words])[0])
              return "".join(said)[:how_long] or None

          for vocabulary, how_long, stage in [
                  (400, 25, "文のようなものに踏み出す"),
                  (1000, 40, "たどたどしい短い文"),
                  (2600, 60, "少しずつ文になっていく"),
                  (5000, 100, "簡単な文"),
                  (9000, 200, "自分の言葉で書ける"),
          ]:
              if vocabulary > len(ranked):
                  continue
              st = {"seen_chars": list(KANA), "learned_words": ranked[:vocabulary],
                    "word_days": {}, "word_last_seen": {}, "word_impact": {},
                    "started_date": "2026-01-01"}
              for t in texts:
                  s.notice_what_follows(st, t)
              print(f"--- 語彙{vocabulary}語 (上限{how_long}字)  [{stage}]")
              for allowed in (0, 2, 4, 99):
                  random.seed(11)
                  made = [speak(st, how_long, allowed) for _ in range(40)]
                  wrote = [m for m in made if m]
                  copied = [m for m in wrote if m in whole]
                  lengths = [len(m) for m in wrote] or [0]
                  name = {0: "分かれ道のみ", 2: "一本道2語まで",
                          4: "一本道4語まで", 99: "制限なし"}[allowed]
                  print(f"    {name:<14} 平均{sum(lengths)//len(lengths):>3}字  "
                        f"原文と一致 {len(copied):>2}件  例: {(wrote[0] or '')[:52]}")
              print()
          PY
