name: Chain probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: What would Senonsei write on its own
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import collections, random, re
          import senonsei_ai as s

          random.seed(3)

          # --- 1. 本物のページを読む ---
          PLACES = [
            "https://www.aozora.gr.jp/cards/000148/files/789_14547.html",   # 漱石『こころ』
            "https://www.aozora.gr.jp/cards/000879/files/127_15260.html",   # 芥川『羅生門』
            "https://anond.hatelabo.jp/",
            "https://www3.nhk.or.jp/news/",
            "https://kakuyomu.jp/",
          ]
          texts = []
          for url in PLACES:
              try:
                  title, text, links, pictures = s.open_page(url)
                  texts.append(text)
                  print(f"  読んだ: {title[:44]} ({len(text)}字)")
              except Exception as e:
                  print(f"  x {url[:60]}: {str(e)[:50]}")

          # --- 2. 出会った回数を数えて、語彙を作る ---
          seen = collections.Counter()
          for t in texts:
              seen.update(s.WORD_CANDIDATE.findall(t))
          ranked = [w for w, _ in seen.most_common()]
          print(f"\n異なる言葉: {len(ranked)}")

          # --- 3. 「この言葉のあとに、この言葉が来た」を覚える ---
          def build_chain(vocabulary):
              known = set(ranked[:vocabulary])
              chain = {}
              for t in texts:
                  # 文のかたまりごとに、続けて出てくる言葉を拾う
                  for piece in re.split(r"[。\n]", t):
                      words = [w for w in s.WORD_CANDIDATE.findall(piece) if w in known]
                      for a, b in zip(words, words[1:]):
                          chain.setdefault(a, collections.Counter())[b] += 1
              return known, chain

          def write_with_chain(known, chain, how_long):
              if not chain:
                  return "(繋がりを一つも知らない)"
              word = random.choice(list(chain))
              out = [word]
              while len("".join(out)) < how_long:
                  nexts = chain.get(out[-1])
                  if not nexts:
                      break
                  words, weights = zip(*nexts.items())
                  out.append(random.choices(words, weights=weights)[0])
              return "".join(out)[:how_long]

          print("\n" + "=" * 60)
          for vocabulary, how_long, stage in [
                  (15, 5, "見た文字を繋げてみる"),
                  (60, 6, "覚えた言葉を1つ書ける"),
                  (150, 15, "覚えた言葉が並び始める"),
                  (400, 25, "文のようなものに踏み出す"),
                  (1000, 40, "たどたどしい短い文"),
                  (2600, 60, "少しずつ文になっていく"),
                  (5000, 100, "簡単な文"),
                  (9000, 200, "自分の言葉で書ける"),
          ]:
              if vocabulary > len(ranked):
                  continue
              known, chain = build_chain(vocabulary)
              links = sum(len(v) for v in chain.values())
              print(f"\n--- 語彙{vocabulary}語 / 繋がり{links}本 / {how_long}字まで  [{stage}]")
              for _ in range(3):
                  print(f"    {write_with_chain(known, chain, how_long)}")

          # --- 4. 今のやり方(助詞で適当に繋ぐ)と比べる ---
          print("\n" + "=" * 60)
          print("いまのやり方(覚えた言葉をランダムに選んで助詞で繋ぐ)")
          for vocabulary in (150, 400, 1000):
              st = {"seen_chars": list("あいうえおかきくけこ"),
                    "learned_words": ranked[:vocabulary]}
              print(f"\n--- 語彙{vocabulary}語")
              for _ in range(3):
                  print(f"    {s.compose_locally(st)}")
          PY
