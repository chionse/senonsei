name: Translate probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Let Senonsei walk into a site written in another language
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import senonsei_ai as s

          s.save_state = lambda state: None
          state = json.load(open('senonsei_state.json', encoding='utf-8'))
          before_words = len(state['word_days'])
          before_chars = len(state['seen_chars'])

          # よその言葉で書かれた場所へ、確実に行かせる
          state['frontier'] = [
              "https://en.wikipedia.org/wiki/Special:Random",
              "https://fr.wikipedia.org/wiki/Sp%C3%A9cial:Page_au_hasard",
          ] + state.get('frontier', [])
          state['visited'] = []

          for round_no in (1, 2):
              print(f"\n===== {round_no}箇所目")
              title = s.walk_once(state)
              print(f"  -> {title!r}")

          print(f"\n見た文字: {before_chars} -> {len(state['seen_chars'])}")
          print(f"出会った言葉: {before_words} -> {len(state['word_days'])}")

          fresh = [w for w in state['word_days'] if state['word_days'][w] == 1]
          print(f"\n新しく出会った言葉(一部): {'、'.join(fresh[-30:])}")
          PY
