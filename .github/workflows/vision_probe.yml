name: Vision probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Let Senonsei actually walk and look at pictures
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import senonsei_ai as s

          s.save_state = lambda state: None   # 本物の記憶は書き換えない
          state = json.load(open('senonsei_state.json', encoding='utf-8'))
          state.setdefault('word_days', {w: 1 for w in state.pop('word_counts', {})})
          state.setdefault('word_last_seen', {})

          before_words = len(state['word_days'])
          before_chars = len(state['seen_chars'])

          # 絵のあるところへ確実に行かせたいので、入口を前に置く
          state['frontier'] = ["https://www3.nhk.or.jp/news/",
                               "https://web.archive.org/web/1999/http://www.geocities.co.jp/"] \
                              + state.get('frontier', [])
          state['visited'] = []

          for round_no in (1, 2):
              print(f"\n===== {round_no}箇所目")
              title = s.walk_once(state)
              print(f"  -> {title!r}")

          print(f"\n見た文字: {before_chars} -> {len(state['seen_chars'])}")
          print(f"出会った言葉: {before_words} -> {len(state['word_days'])}")
          print("\n見てきた絵:")
          for one in state.get('pictures_seen', []):
              print("  ", one)
          PY
