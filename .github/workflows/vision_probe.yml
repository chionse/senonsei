name: Vision probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Work out which pictures are worth looking at
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, struct, urllib.request, urllib.parse
          import senonsei_ai as s

          ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          IMG = re.compile(r'<img[^>]+src\s*=\s*["\']([^"\']+)', re.IGNORECASE)
          DECORATION = re.compile(
              r"logo|icon|favicon|banner|btn|button|sprite|badge|avatar|spacer|blank|"
              r"arrow|bullet|/line|dot|border|/bg[-_.]|background|header|footer|nav|"
              r"sns|share|/ad|emoji|stamp|loading|dummy|noimage|placeholder",
              re.IGNORECASE)

          def measure(data):
              """ファイルの先頭だけ読んで、縦横のピクセル数を出す。"""
              if data[:8] == b"\x89PNG\r\n\x1a\n":
                  w, h = struct.unpack(">II", data[16:24])
                  return w, h
              if data[:3] == b"GIF":
                  w, h = struct.unpack("<HH", data[6:10])
                  return w, h
              if data[:2] == b"\xff\xd8":
                  i = 2
                  while i < len(data) - 9:
                      if data[i] != 0xFF:
                          i += 1
                          continue
                      marker = data[i + 1]
                      if marker in (0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7,
                                    0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF):
                          h, w = struct.unpack(">HH", data[i + 5:i + 9])
                          return w, h
                      if marker in (0xD8, 0xD9) or 0xD0 <= marker <= 0xD7:
                          i += 2
                          continue
                      length = struct.unpack(">H", data[i + 2:i + 4])[0]
                      i += 2 + length
                  return None
              if data[:4] == b"RIFF" and data[8:12] == b"WEBP":
                  kind = data[12:16]
                  if kind == b"VP8X":
                      w = int.from_bytes(data[24:27], "little") + 1
                      h = int.from_bytes(data[27:30], "little") + 1
                      return w, h
                  if kind == b"VP8 ":
                      w = struct.unpack("<H", data[26:28])[0] & 0x3FFF
                      h = struct.unpack("<H", data[28:30])[0] & 0x3FFF
                      return w, h
                  if kind == b"VP8L":
                      bits = int.from_bytes(data[21:25], "little")
                      return (bits & 0x3FFF) + 1, ((bits >> 14) & 0x3FFF) + 1
              return None

          def grab(url, cap=1200000):
              req = urllib.request.Request(url, headers={"User-Agent": s.USER_AGENT})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read(cap)

          def describe(data):
              url = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/ai/run/@cf/llava-hf/llava-1.5-7b-hf"
              payload = {"image": list(data),
                         "prompt": "この絵に何が写っていますか。日本語で短く答えてください。",
                         "max_tokens": 120}
              req = urllib.request.Request(
                  url, data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      body = json.loads(r.read().decode())
                  return (body.get("result") or {}).get("description", "").strip()
              except Exception as e:
                  return f"(だめだった: {str(e)[:80]})"

          PAGES = ["https://www3.nhk.or.jp/news/", "https://b.hatena.ne.jp/hotentry",
                   "https://anond.hatelabo.jp/", "https://www.aozora.gr.jp/",
                   "https://web.archive.org/web/1999/http://www.geocities.co.jp/"]

          worth_a_look = []
          for page in PAGES:
              try:
                  req = urllib.request.Request(page, headers={"User-Agent": s.USER_AGENT})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      html = r.read(400000).decode("utf-8", errors="ignore")
                      base = r.geturl()
              except Exception as e:
                  print(f"x {page}: {str(e)[:60]}")
                  continue

              print(f"\n===== {s.place_of(page)}")
              srcs = list(dict.fromkeys(IMG.findall(html)))[:18]
              for src in srcs:
                  full = urllib.parse.urljoin(base, src.strip())
                  if not re.search(r"\.(jpe?g|png|gif|webp)($|\?)", full, re.I):
                      continue
                  try:
                      data = grab(full)
                  except Exception:
                      continue
                  size = measure(data)
                  name = full.split("/")[-1][:34]
                  if not size:
                      print(f"   ?x?          {len(data):>7}B  {name}  (大きさが読めない)")
                      continue
                  w, h = size
                  ratio = w / h if h else 0
                  flags = []
                  if w < 300 or h < 200:
                      flags.append("小さい")
                  if not (0.3 <= ratio <= 3.0):
                      flags.append("細長い")
                  if DECORATION.search(full):
                      flags.append("飾りの名前")
                  if len(data) < 8000:
                      flags.append("軽すぎ")
                  verdict = "見る" if not flags else "除く(" + "/".join(flags) + ")"
                  print(f"   {w:>5}x{h:<5} {len(data):>7}B  {name:<36} {verdict}")
                  if not flags:
                      worth_a_look.append((s.place_of(page), full, w, h, data))

          print(f"\n\n===== 見る価値があると判断した絵: {len(worth_a_look)}枚")
          for where, full, w, h, data in worth_a_look[:8]:
              text = describe(data)
              words = set(s.WORD_CANDIDATE.findall(text))
              print(f"\n  {where} {w}x{h}")
              print(f"    {full[:100]}")
              print(f"    説明: {text[:220]}")
              print(f"    拾える言葉({len(words)}): {'、'.join(list(words)[:18])}")
          PY
