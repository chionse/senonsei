name: Search probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Can Senonsei go looking for a word it knows
        run: |
          python - <<'PY'
          import collections, json, urllib.parse, urllib.request
          import senonsei_ai as s

          WORDS = ["魚", "海", "猫", "電車"]

          def open_it(url):
              return s.open_page(url)

          def try_doorway(label, make_url, word):
              url = make_url(word)
              try:
                  title, text, links, pictures = open_it(url)
              except Exception as e:
                  print(f"  x {label:<22} {str(e)[:60]}")
                  return []
              # その検索結果から、よそのサイトへ続く道だけ拾う
              here = s.place_of(url)
              outward = [l for l in dict.fromkeys(links) if s.place_of(l) != here]
              places = collections.Counter(s.place_of(l) for l in outward)
              print(f"  o {label:<22} 道{len(outward):>3}本 / {len(places):>2}か所  "
                    f"(本文{len(text)}字)")
              return outward

          doorways = [
              ("はてブ検索", lambda w: "https://b.hatena.ne.jp/search/text?q=" + urllib.parse.quote(w)),
              ("はてブ検索(タグ)", lambda w: "https://b.hatena.ne.jp/search/tag?q=" + urllib.parse.quote(w)),
              ("Wikipedia検索", lambda w: "https://ja.wikipedia.org/w/index.php?search=" + urllib.parse.quote(w)),
              ("青空文庫の検索", lambda w: "https://www.aozora.gr.jp/cgi-bin/index_pages/sakuhin_title.cgi?title=" + urllib.parse.quote(w)),
              ("なろう検索", lambda w: "https://yomou.syosetu.com/search.php?word=" + urllib.parse.quote(w)),
              ("カクヨム検索", lambda w: "https://kakuyomu.jp/search?q=" + urllib.parse.quote(w)),
              ("増田検索", lambda w: "https://anond.hatelabo.jp/search?q=" + urllib.parse.quote(w)),
          ]

          gathered = {}
          for label, make_url in doorways:
              print(f"\n===== {label}")
              all_links = []
              for word in WORDS:
                  print(f"  [{word}]", end=" ")
                  all_links += try_doorway(label, make_url, word)
              gathered[label] = all_links

          print("\n\n===== どこへ続いていたか(重複をまとめて)")
          for label, links in gathered.items():
              if not links:
                  continue
              places = collections.Counter(s.place_of(l) for l in links)
              wiki = sum(n for p, n in places.items() if "wikipedia" in p or "wikimedia" in p)
              total = sum(places.values())
              print(f"\n  {label}: {total}本 / {len(places)}か所  "
                    f"(うちwiki系 {wiki*100//max(1,total)}%)")
              for place, n in places.most_common(12):
                  print(f"      {n:>3}  {place}")
          PY
