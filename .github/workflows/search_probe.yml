name: Search probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Let Senonsei go looking for words it knows
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import collections, json
          import senonsei_ai as s

          state = json.load(open('senonsei_state.json', encoding='utf-8'))
          # まだ一つも覚えていないので、覚えた後を先に見せてもらう
          state['learned_words'] = ["魚", "海", "猫", "電車", "空", "こども"]
          before = set(state['frontier'])

          print("=== 何を気にするか、自分で選べるか ===")
          word = s.something_it_wonders_about(state)
          print(f"  選んだ言葉: {word!r}")

          print("\n=== 探しに行けるか ===")
          for w in ["魚", "空"]:
              found = s.go_looking_for(state, w)
              if found:
                  places = collections.Counter(s.place_of(u) for u in found)
                  print(f"  「{w}」-> {len(found)}本 / {len(places)}か所")
                  for p, n in places.most_common(10):
                      print(f"       {n:>2}  {p}")

          after = set(state['frontier'])
          fresh = after - before
          print(f"\n=== 行き先に加わったもの ===")
          print(f"  {len(before)}件 -> {len(after)}件")
          places = collections.Counter(s.place_of(u) for u in state['frontier'])
          print(f"  行ける場所: {len(places)}か所")
          for p, n in places.most_common(20):
              print(f"    {n:>2}  {p}")

          print(f"\n=== 探した記録 ===")
          for one in state.get('looked_for', []):
              print("  ", one)
          PY
