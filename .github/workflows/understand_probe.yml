name: Understand probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Does Senonsei understand where it has been
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import senonsei_ai as s

          s.save_state = lambda state: None
          state = json.load(open('senonsei_state.json', encoding='utf-8'))
          state['frontier'] = [
              "https://www.aozora.gr.jp/",
              "https://anond.hatelabo.jp/",
              "https://web.archive.org/web/1999/http://www.geocities.co.jp/",
          ] + state.get('frontier', [])
          state['visited'] = []

          for round_no in (1, 2, 3):
              print(f"\n===== {round_no}箇所目")
              title = s.walk_once(state)
              print(f"  -> {title!r}")

          print("\n===== 千遠生が受け取ったもの")
          for one in state.get('impressions', []) or ["(まだ無い)"]:
              print("  ", one)

          print("\n===== 書くときに思い出すもの")
          for one in s.what_it_remembers(state):
              print("  ", one)
          PY
