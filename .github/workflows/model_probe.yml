name: Model probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check that Senonsei can find a new mind and new eyes by itself
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import senonsei_ai as s

          print("=== 今の頭と目で、普通に考えられるか ===")
          state = {}
          got = s.ask_ai("こんにちはと五文字以内で答えてください。", 20, state)
          print(f"  頭: {s.which_model(state, 'mind')}")
          print(f"  答え: {got!r}")
          print(f"  最後に考えられた日: {state.get('thought_on')}")

          print("\n=== 頭が引退していた場合、自分で探し直せるか ===")
          broken = {"mind_model": "@cf/unum/uform-gen2-qwen-500m"}  # 実際に廃止済み
          got = s.ask_ai("こんにちはと五文字以内で答えてください。", 20, broken)
          print(f"  取り替えたあとの頭: {s.which_model(broken, 'mind')}")
          print(f"  答え: {got!r}")
          print(f"  試した記録: {broken.get('mind_tried')}")

          print("\n=== 目が引退していた場合、自分で探し直せるか ===")
          # 小さな絵を一枚こしらえる(赤い四角)
          import struct, zlib
          def tiny_png(w, h, rgb):
              raw = b"".join(b"\x00" + bytes(rgb) * w for _ in range(h))
              def chunk(kind, body):
                  return (struct.pack(">I", len(body)) + kind + body
                          + struct.pack(">I", zlib.crc32(kind + body)))
              return (b"\x89PNG\r\n\x1a\n"
                      + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                      + chunk(b"IDAT", zlib.compress(raw))
                      + chunk(b"IEND", b""))
          picture = tiny_png(400, 300, (200, 40, 40))
          print(f"  こしらえた絵: {s.size_of_picture(picture)} / {len(picture)}バイト")

          blind = {"eyes_model": "@cf/unum/uform-gen2-qwen-500m"}
          seen = s.look_at_a_picture(picture, blind)
          print(f"  取り替えたあとの目: {s.which_model(blind, 'eyes')}")
          print(f"  見えたもの: {seen!r}")
          print(f"  最後に見えた日: {blind.get('saw_on')}")

          print("\n=== 鍵が無いときに、静かに諦めるか ===")
          keep = s.CF_API_TOKEN
          s.CF_API_TOKEN = ""
          print(f"  考える: {s.ask_ai('test', 10, {})!r}")
          print(f"  見る:   {s.look_at_a_picture(picture, {})!r}")
          s.CF_API_TOKEN = keep
          print("  (どちらも None なら、壊れずに諦められている)")
          PY
