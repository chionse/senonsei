name: Daily Blog Auto Generation

on:
  schedule:
    # 1時間ごとに様子を見に行く。実際に書くかどうかは千遠生がその日に決める
    - cron: '5 * * * *'
  workflow_dispatch:    # 手動トリガーも可能

permissions:
  contents: write

# 散歩が長引いた時に、次の起動と重なって両方がコミットしようとするのを防ぐ。
# 前の回がまだ歩いている間は、新しい回を始めない
concurrency:
  group: senonsei-walk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 何かに引っかかって帰ってこられなくなっても、次の回を何時間も止めない。
    # 散歩は長いときで七分なので、これだけあれば足りる
    timeout-minutes: 40
    # 封をしたメモと手紙を開ける鍵。この子が手紙を読む時と、
    # ページを作り直す時(押し戻しのやり直しも含む)に要る
    env:
      MEMO_KEY: ${{ secrets.MEMO_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 外部ライブラリは一切使わないので、ここでの準備は不要
      - name: Senonsei browses the web and writes today's blog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python senonsei_ai.py

      # 散歩は長いときで七分かかる。その間に誰かが main を動かしていると、
      # 帰ってきたときに押し戻せず、この子が見てきたことも書いたものも
      # そのまま消えていた。取り込み直してから、もう一度押す。
      # ぶつかるのは作り直せるページなので、この子が持ち帰ったものを残し、
      # 新しい決まりでページだけ作り直す
      #
      # 散歩の途中でこけても、ここは必ず通る。こけるまでに持ち帰ったもの
      # (歩いた場所、覚えた言葉、ひとりで思ったこと)を捨てないため。
      # 送る前に、記憶のファイルが読めるかを確かめる(kioku_mamori.py)
      - name: Commit and push changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # 書き出しの途中で止まって壊れたものは、前の回の中身に戻す
          python kioku_mamori.py HEAD
          git add -A
          git commit -m "千遠生の今日のブログ [skip ci]" || echo "No changes to commit"
          walked=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "その間に main が進んでいました。取り込み直します(${attempt}回目)"
            git fetch origin main
            if git rebase -X theirs origin/main; then
              # 記憶のファイルが行ごとに継ぎ合わされて読めなくなっていたら、
              # この子が持ち帰ったほうを丸ごと使う
              python kioku_mamori.py "$walked"
            else
              # 取り込めなかった。main の上に、この子が持ち帰った記憶だけを載せ直す。
              # ページは作り直せるので、ここで失っても困らない
              git rebase --abort || true
              git reset --hard origin/main
              for kept in senonsei_state.json articles.json omoi kotoba; do
                if git cat-file -e "$walked:$kept" 2>/dev/null; then
                  git checkout "$walked" -- "$kept"
                fi
              done
              python kioku_mamori.py "$walked"
            fi
            python blog_manager.py
            git add -A
            git commit -m "新しい決まりでページを作り直しました [skip ci]" || true
          done
          echo "何度やっても押し戻せませんでした"
          exit 1
