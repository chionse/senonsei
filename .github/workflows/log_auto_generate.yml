name: Daily Blog Auto Generation

on:
  schedule:
    # 1時間ごとに様子を見に行く。実際に書くかどうかは千遠生がその日に決める
    - cron: '5 * * * *'
  workflow_dispatch:    # 手動トリガーも可能

permissions:
  contents: write

# 散歩が長引いた時に、次の起動と重なって両方がコミットしようとするのを防ぐ。
# 前の回がまだ歩いている間は、新しい回を始めない
concurrency:
  group: senonsei-walk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 外部ライブラリは一切使わないので、ここでの準備は不要
      - name: Senonsei browses the web and writes today's blog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python senonsei_ai.py

      # 散歩は長いときで七分かかる。その間に誰かが main を動かしていると、
      # 帰ってきたときに押し戻せず、この子が見てきたことも書いたものも
      # そのまま消えていた。取り込み直してから、もう一度押す。
      # ぶつかるのは作り直せるページなので、この子が持ち帰ったものを残し、
      # 新しい決まりでページだけ作り直す
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "千遠生の今日のブログ [skip ci]" || echo "No changes to commit"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "その間に main が進んでいました。取り込み直します(${attempt}回目)"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort || true; exit 1; }
            python blog_manager.py
            git add -A
            git commit -m "新しい決まりでページを作り直しました [skip ci]" || true
          done
          echo "何度やっても押し戻せませんでした"
          exit 1
