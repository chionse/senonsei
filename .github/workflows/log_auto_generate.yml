name: Daily Blog Auto Generation

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日午前0時(UTC)に実行
  workflow_dispatch:    # 手動トリガーも可能

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          # もし依存パッケージあればここに書く（今は無し）

      - name: Run blog manager script
        run: |
          python blog_manager.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html kakodogu.html articles.json blogs/
          git commit -m "Auto update blogs and past logs [skip ci]" || echo "No changes to commit"
          git push
        
          env:
          # GITHUB_TOKEN は自動で設定されているので特に書かなくてOK
