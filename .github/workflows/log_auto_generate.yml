name: Daily Blog Auto Generation

on:
  schedule:
    # 1時間ごとに様子を見に行く。実際に書くかどうかは千遠生がその日に決める
    - cron: '5 * * * *'
  workflow_dispatch:    # 手動トリガーも可能

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 外部ライブラリは一切使わないので、ここでの準備は不要
      - name: Senonsei browses the web and writes today's blog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python senonsei_ai.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "千遠生の今日のブログ [skip ci]" || echo "No changes to commit"
          git push
