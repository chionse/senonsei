name: Daily Blog Auto Generation

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日午前0時(UTC) = 日本時間の午前9時に実行
  workflow_dispatch:    # 手動トリガーも可能

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # anthropic が無くても千遠生は自分の力で書けるので、失敗しても止めない
      - name: Install optional requirements
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic

      - name: Senonsei browses the web and writes today's blog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python senonsei_ai.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html kakodogu.html keyword.html menu.html articles.json keywords.json menu.json senonsei_state.json blogs/
          git commit -m "千遠生の今日のブログ [skip ci]" || echo "No changes to commit"
          git push
