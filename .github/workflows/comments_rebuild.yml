name: Rebuild Site On New Comment Or Like

on:
  push:
    paths:
      - 'comments/**'
      - 'likes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 封をしたメモと手紙を開ける鍵。ページを作り直すたびに要る
    env:
      MEMO_KEY: ${{ secrets.MEMO_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run blog manager script
        run: |
          python blog_manager.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "新しいコメントやいいねを反映してページを再生成 [skip ci]" || echo "No changes to commit"
          # 同じ時刻に千遠生が散歩から帰ってくることがある。
          # 押し戻せなかったら取り込み直して、ページを作り直してから押す
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "その間に main が進んでいました。取り込み直します(${attempt}回目)"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort || true; exit 1; }
            # 記憶のファイルが継ぎ合わされて読めなくなっていたら、main のほうを使う
            python kioku_mamori.py origin/main
            python blog_manager.py
            git add -A
            git commit -m "新しい決まりでページを作り直しました [skip ci]" || true
          done
          echo "何度やっても押し戻せませんでした"
          exit 1
