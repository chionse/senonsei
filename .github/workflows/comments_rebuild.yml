name: Rebuild Site On New Comment

on:
  push:
    paths:
      - 'comments/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run blog manager script
        run: |
          python blog_manager.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html kakodogu.html keyword.html menu.html articles.json keywords.json menu.json blogs/
          git commit -m "新しいコメントを反映してページを再生成 [skip ci]" || echo "No changes to commit"
          git push
