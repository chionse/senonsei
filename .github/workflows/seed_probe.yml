name: Seed probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Project growth with sites kept as units
        run: |
          python - <<'PY'
          import datetime, random, time
          import senonsei_ai as s

          random.seed(20260912)
          COLLECT_UNTIL = time.monotonic() + 13 * 60
          WANT_SITES = 40
          PAGES_PER_SITE = 8

          # --- 1. サイトを単位として材料を集める ---
          sites = {}          # 場所 -> [ページの言葉の集合]
          all_kana = set()
          queue = list(s.SEEDS)
          random.shuffle(queue)
          seen_urls = set()

          while queue and len(sites) < WANT_SITES and time.monotonic() < COLLECT_UNTIL:
              entrance = queue.pop(0)
              here = s.place_of(entrance)
              if here in sites or entrance in seen_urls:
                  continue
              seen_urls.add(entrance)
              try:
                  title, text, links = s.open_page(entrance)
              except Exception:
                  continue

              pages = [set(s.WORD_CANDIDATE.findall(text))]
              all_kana |= set(s.HIRAGANA.findall(text))
              inward = [l for l in dict.fromkeys(links) if s.place_of(l) == here]
              outward = [l for l in dict.fromkeys(links) if s.place_of(l) != here]
              random.shuffle(inward)
              for link in inward[: PAGES_PER_SITE - 1]:
                  if time.monotonic() > COLLECT_UNTIL:
                      break
                  try:
                      t, tx, _ = s.open_page(link)
                  except Exception:
                      continue
                  pages.append(set(s.WORD_CANDIDATE.findall(tx)))
                  all_kana |= set(s.HIRAGANA.findall(tx))

              pages = [p for p in pages if p]
              if pages:
                  sites[here] = pages
                  print(f"  {len(sites):>2}. {here} ({len(pages)}ページ)")
              random.shuffle(outward)
              queue.extend(outward[:6])

          everything = set().union(*[w for ps in sites.values() for w in ps])
          print(f"\n材料: {len(sites)}サイト / "
                f"{sum(len(p) for p in sites.values())}ページ / "
                f"異なる言葉 {len(everything)}")

          # 「どのサイトにいくつ現れるか」で、言葉の珍しさを見る
          spread = {}
          for ps in sites.values():
              for w in set().union(*ps):
                  spread[w] = spread.get(w, 0) + 1
          only_one = sum(1 for c in spread.values() if c == 1)
          print(f"そのうち、ひとつのサイトにしか無い言葉: {only_one} "
                f"({only_one * 100 // len(everything)}%)")

          # --- 2. 1日 = 2サイト x 8ページ として先を計算する ---
          MILESTONES = [7, 14, 30, 60, 90, 180, 270, 365, 547, 730]
          names = list(sites)

          def project(days_needed, fade, grows_every):
              s.DAYS_BEFORE_LEARNING = days_needed
              s.FADE_AFTER_DAYS = fade
              s.MEMORY_GROWS_EVERY = grows_every or 10**9
              state = {"seen_chars": list(all_kana), "word_days": {},
                       "word_last_seen": {}, "learned_words": []}
              start = datetime.date(2026, 9, 13)
              out = {}
              for day in range(1, max(MILESTONES) + 1):
                  when = start + datetime.timedelta(days=day - 1)
                  s.today_in_japan = lambda w=when: datetime.datetime(w.year, w.month, w.day)
                  stamp = when.isoformat()
                  today_words = set()
                  for site in random.sample(names, min(2, len(names))):
                      for page in random.sample(sites[site], min(8, len(sites[site]))):
                          today_words |= page
                  for w in today_words:
                      if state["word_last_seen"].get(w) != stamp:
                          state["word_last_seen"][w] = stamp
                          state["word_days"][w] = state["word_days"].get(w, 0) + 1
                  s.forget(state)
                  s.learn(state)
                  if day in MILESTONES:
                      out[day] = len(state["learned_words"])
              return out, state

          combos = [
              ("5日/薄7/育たない", 5, 7, None),
              ("5日/薄7/40語毎", 5, 7, 40),
              ("10日/薄7/40語毎", 10, 7, 40),
              ("20日/薄5/60語毎", 20, 5, 60),
              ("30日/薄5/100語毎", 30, 5, 100),
              ("30日/薄3/150語毎", 30, 3, 150),
          ]
          curves, samples = {}, {}
          for label, d, f, g in combos:
              curves[label], st = project(d, f, g)
              samples[label] = st["learned_words"][:14]

          print("\n覚えている言葉の数の見通し")
          print("  日数 |" + "".join(f"{l:^18}|" for l, *_ in combos))
          for m in MILESTONES:
              print(f"  {m:>4}日 |" + "".join(f"{curves[l][m]:>17} |" for l, *_ in combos))

          print("\n段階の区切り(今): 15 / 60 / 120 / 200 / 320 / 480 / 700")
          for label, *_ in combos:
              print(f"\n{label} が最初に覚える言葉: " + "、".join(samples[label]))
          PY
