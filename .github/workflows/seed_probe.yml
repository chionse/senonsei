name: Seed probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Project the growth curve over a year
        run: |
          python - <<'PY'
          import datetime, random, re
          import senonsei_ai as s

          random.seed(20260912)

          # --- 1. 本物のページを集める ---
          pool = []
          for seed in s.SEEDS:
              try:
                  title, text, links = s.open_page(seed)
              except Exception as e:
                  print(f"  x {seed} ({str(e)[:40]})")
                  continue
              here = s.place_of(seed)
              pages = [(title, text)]
              inward = [l for l in dict.fromkeys(links) if s.place_of(l) == here]
              random.shuffle(inward)
              for link in inward[:3]:
                  try:
                      t, tx, _ = s.open_page(link)
                      pages.append((t, tx))
                  except Exception:
                      pass
              for t, tx in pages:
                  words = set(s.WORD_CANDIDATE.findall(tx))
                  kana = set(s.HIRAGANA.findall(tx))
                  if words:
                      pool.append((words, kana))
              print(f"  o {here}: {len(pages)}ページ")

          print(f"\n集まった材料: {len(pool)}ページ / "
                f"異なる言葉 {len(set().union(*[w for w, k in pool]))}")

          PAGES_A_DAY = 16   # 1日2箇所 x 最大8ページ
          MILESTONES = [3, 5, 7, 10, 14, 21, 30, 60, 90, 120, 180, 270, 365]

          def project(days_needed, fade):
              s.DAYS_BEFORE_LEARNING = days_needed
              s.FADE_AFTER_DAYS = fade
              state = {"seen_chars": [], "word_days": {}, "word_last_seen": {},
                       "learned_words": []}
              start = datetime.date(2026, 9, 13)
              result = {}
              for day in range(1, max(MILESTONES) + 1):
                  when = start + datetime.timedelta(days=day - 1)
                  s.today_in_japan = lambda w=when: datetime.datetime(
                      w.year, w.month, w.day)
                  stamp = when.isoformat()
                  seen_today = set()
                  for words, kana in random.sample(pool, min(len(pool), PAGES_A_DAY)):
                      seen_today |= words
                      for ch in kana:
                          if ch not in state["seen_chars"]:
                              state["seen_chars"].append(ch)
                  for word in seen_today:
                      if state["word_last_seen"].get(word) != stamp:
                          state["word_last_seen"][word] = stamp
                          state["word_days"][word] = state["word_days"].get(word, 0) + 1
                  s.forget(state)
                  s.learn(state)
                  if day in MILESTONES:
                      result[day] = len(state["learned_words"])
              return result, state

          combos = [(5, 7), (5, 14), (10, 7), (20, 7), (30, 14), (60, 30), (90, 30)]
          curves = {}
          for d, f in combos:
              curves[(d, f)], last = project(d, f)
              if (d, f) == (5, 7):
                  sample = last["learned_words"][:30]

          print("\n覚えている言葉の数の見通し")
          head = "  日数 |" + "".join(f"{d:>4}日/薄{f:<3}|" for d, f in combos)
          print(head)
          print("  " + "-" * (len(head) - 2))
          for m in MILESTONES:
              row = f"{m:>5}日 |"
              for c in combos:
                  row += f"{curves[c][m]:>9}|"
              print("  " + row)

          print("\n段階の区切り(今): 15 / 60 / 120 / 200 / 320 / 480 / 700")
          print("\n5日/薄7 で最初に覚える言葉:", "、".join(sample))
          PY
