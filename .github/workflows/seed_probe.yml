name: Seed probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Simulate several days of walking and measure what is learned
        run: |
          python - <<'PY'
          import json, random
          import senonsei_ai as s

          # 本物の記憶を写して使う。書き戻しはしない
          s.save_state = lambda state: None
          state = json.load(open('senonsei_state.json', encoding='utf-8'))

          print(f"はじめ: 見た文字 {len(state['seen_chars'])} / "
                f"出会った言葉 {len(state['word_counts'])} / "
                f"覚えた言葉 {len(state['learned_words'])}")
          print(f"1日に見て回る場所: {s.sites_per_day(state)}\n")

          for day in range(1, 6):
              for _ in range(s.sites_per_day(state)):
                  title = s.walk_once(state)
                  if title:
                      learned = s.learn(state)
                      print(f"  {day}日目 {title[:40]!r}  +{len(learned)}語")
              stage, limit = s.current_stage(state)
              print(f"{day}日目おわり: 文字 {len(state['seen_chars'])} / "
                    f"出会い {len(state['word_counts'])} / "
                    f"覚えた {len(state['learned_words'])}  [{stage} / {limit}字]\n")

          print("覚えた言葉(先頭40):", "、".join(state['learned_words'][:40]))
          PY
