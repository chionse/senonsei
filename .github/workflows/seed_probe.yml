name: Seed probe (temporary)

on:
  push:
    branches:
      - claude/project-progress-update-t2tukz

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compare three ways of counting an encounter
        run: |
          python - <<'PY'
          import json
          import senonsei_ai as s

          s.save_state = lambda state: None
          s.TIME_SPENT_PER_SITE = 45
          DAYS = 5

          state = json.load(open('senonsei_state.json', encoding='utf-8'))
          state['word_counts'] = {}          # 数え方を比べたいので、出会いは白紙から

          raw = {}        # 出てきた回数
          on_pages = {}   # 別々のページで何回
          on_days = {}    # 別々の日に何回
          seen_pages = {}
          seen_days = {}
          curve = []

          real_absorb = s.absorb
          today = [0]

          def absorb(st, text):
              real_absorb(st, text)
              page = len(st['visited'])
              for w in set(s.WORD_CANDIDATE.findall(text)):
                  if w not in seen_pages or seen_pages[w] != page:
                      seen_pages[w] = page
                      on_pages[w] = on_pages.get(w, 0) + 1
                  if w not in seen_days or seen_days[w] != today[0]:
                      seen_days[w] = today[0]
                      on_days[w] = on_days.get(w, 0) + 1
              for w in s.WORD_CANDIDATE.findall(text):
                  raw[w] = raw.get(w, 0) + 1

          s.absorb = absorb

          for day in range(1, DAYS + 1):
              today[0] = day
              for _ in range(s.sites_per_day(state)):
                  s.walk_once(state)
              curve.append((day, len(state['visited']), len(raw)))
              print(f"{day}日目: 累計 {len(state['visited'])}ページ / "
                    f"出会った言葉 {len(raw)}")

          def table(name, counts, thresholds):
              print(f"\n=== {name} ===")
              for n in thresholds:
                  got = sum(1 for c in counts.values() if c >= n)
                  print(f"  {n:>4}回で覚える -> {DAYS}日後に {got:>6} 語")

          table("出てきた回数(今の数え方)", raw, (5, 20, 50, 100, 300, 1000, 3000))
          table("別々のページで何回", on_pages, (3, 5, 10, 20, 30, 50, 80))
          table("別々の日に何回", on_days, (2, 3, 4, 5))

          print("\n--- よく出会った言葉 ---")
          for name, counts in (("回数", raw), ("ページ数", on_pages), ("日数", on_days)):
              top = sorted(counts.items(), key=lambda kv: -kv[1])[:12]
              print(f"  {name}: " + "、".join(f"{w}({c})" for w, c in top))
          PY
