name: Check Genre Doors Once
# 一度きりの確かめ。終わったら消す
on:
  push:
    branches:
      - claude/project-progress-update-t2tukz
    paths:
      - 'tobira_check.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python tobira_check.py
